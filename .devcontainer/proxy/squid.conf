# Tunnels (CONNECT) to port 443 of the allowed domains, nothing else: no plain HTTP, no other
# ports, no caching. Each request is logged to stdout: `docker logs <project>-proxy-1`.
http_port 3128

acl allowed dstdomain "/etc/squid/allowed-domains.txt"
acl https port 443
acl CONNECT method CONNECT

http_access deny !CONNECT
http_access deny !https
http_access allow allowed
http_access deny all

cache deny all
cache_dir null /tmp
access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr
pid_filename none
shutdown_lifetime 1 seconds
